# Primary API and web workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corridor-app
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corridor-app
  template:
    metadata:
      labels:
        app: corridor-app
    spec:
      imagePullSecrets:
        - name: registry-secret
      # The image runs as UID 1001 in group 0 (GID 0), as Red Hat images do; everything it writes on the
      # volumes belongs to group 0, which may write it as the owner does
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: corridor-app
          image: corridor-image
          imagePullPolicy: Always
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /opt/corridor/data /opt/corridor/uploads /opt/corridor/databases
              cd /opt/corridor
              source venv/bin/activate
              exec venv/bin/corridor-api run
          env:
            # Where the app finds the kernel worker that runs the code (base/worker-deployment.yaml)
            - name: CORRIDOR_KERNEL_WORKER_URL
              value: http://corridor-worker-service:5001
          ports:
            - containerPort: 5002
          volumeMounts:
            - name: config-volume
              mountPath: /opt/corridor/config
            - name: data-volume
              mountPath: /opt/corridor/data
            - name: uploads-volume
              mountPath: /opt/corridor/uploads
            - name: databases-volume
              mountPath: /opt/corridor/databases
            - name: kernels-volume
              mountPath: /opt/corridor/kernels
          livenessProbe:
            httpGet:
              path: /api
              port: 5002
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "3Gi"
            limits:
              memory: "6Gi"
      volumes:
        - name: config-volume
          configMap:
            name: corridor-app-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: databases-volume
          persistentVolumeClaim:
            claimName: databases-pvc
        - name: kernels-volume
          persistentVolumeClaim:
            claimName: kernels-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: corridor-app-service
spec:
  type: ClusterIP
  selector:
    app: corridor-app
  ports:
    - port: 5002
      targetPort: 5002
