# The kernel worker: a Jupyter server (`corridor-worker run`, port 5001) that runs all the Python code of the platform.
# The app asks it for kernels, and the kernels are closed after 15 minutes idle. Every kernel is a process of
# this pod, so its memory holds them all: at most KERNEL_MAX_PROCESSES (default 4) at a time, set in api_config.py.
# The worker and the app share the kernels volume (the Python environments of the kernels) and the data and uploads
# volumes (the files that jobs read and write).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corridor-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corridor-worker
  template:
    metadata:
      labels:
        app: corridor-worker
    spec:
      imagePullSecrets:
        - name: registry-secret
      # The image runs as UID 1001 in group 0 (GID 0), as Red Hat images do; everything it writes on the
      # volumes belongs to group 0, which may write it as the owner does
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: corridor-worker
          image: corridor-image
          imagePullPolicy: Always
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /opt/corridor/data /opt/corridor/uploads
              cd /opt/corridor
              source venv/bin/activate
              exec venv/bin/corridor-worker run
          env:
            - name: CORRIDOR_API_URL
              value: http://corridor-app-service:5002
          ports:
            - containerPort: 5001
          volumeMounts:
            - name: config-volume
              mountPath: /opt/corridor/config
            - name: data-volume
              mountPath: /opt/corridor/data
            - name: uploads-volume
              mountPath: /opt/corridor/uploads
            - name: databases-volume
              mountPath: /opt/corridor/databases
            - name: kernels-volume
              mountPath: /opt/corridor/kernels
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "10Gi"
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: corridor-worker-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: databases-volume
          persistentVolumeClaim:
            claimName: databases-pvc
        - name: kernels-volume
          persistentVolumeClaim:
            claimName: kernels-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: corridor-worker-service
spec:
  type: ClusterIP
  selector:
    app: corridor-worker
  ports:
    - port: 5001
      targetPort: 5001
